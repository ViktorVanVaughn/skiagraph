<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t d">
<title id="t">Skiagraph: an SVG renderer for VMD</title>
<desc id="d">Protein: ubiquitin, PDB 1UBQ (Vijay-Kumar, Bugg and Cook, J. Mol. Biol. 194, 531, 1987). On the staff: its silhouette. 2.5D: Skiagraph's own SVG drawing of the banner's VMD scene, reduced to a few flat tones for small sizes. Figures: original drawings in the Attic black-figure manner.</desc>
